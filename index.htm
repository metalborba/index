<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="theme-color" content="#0A3D62" />
  <style>
    :root {
      --bg:#0A3D62; --acc:#F8C102; --txt:#14202A; --light:#F7FAFC; --card:#FFFFFF;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial, sans-serif; background:var(--light); color:var(--txt); line-height:1.6}
    header, footer{background:var(--bg); color:#fff; text-align:center; padding:1rem}
    .brand{font-weight:700}
    .grid{max-width:900px; margin:2rem auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem}
    .card{background:var(--card); border-radius:8px; padding:1rem; text-align:center; cursor:pointer; transition:.2s}
    .card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1); transform:translateY(-3px)}
    .card h3{color:var(--bg); margin-bottom:.5rem}
    footer small{display:block; margin-top:.5rem}
    .whatsapp-float {
      position: fixed; width: 55px; height: 55px; bottom: 20px; right: 20px;
      background-color: #25d366; border-radius: 50%; display:flex; align-items:center; justify-content:center;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    }
    .whatsapp-float img {width:30px; height:30px}
  </style>
</head>

      <div class="card" onclick="location.href='art.html'">

      </div>

  </main>

  <footer>

</html>
